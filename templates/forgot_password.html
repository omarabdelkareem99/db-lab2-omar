{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="card">
  <h1 class="title">Forgot password?</h1>
  <p class="sub">Enter your email and we'll send you a 4-digit code.</p>
  <form method="POST" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email">
    {% if errors.email %}<p class="error">{{ errors.email }}</p>{% endif %}
    <button type="submit" class="btn">Send code</button>
  </form>
  <p class="links"><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
