<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todo{% endblock %}</title>
  <script>try{if(sessionStorage.getItem('greeted'))document.documentElement.classList.add('greeted')}catch(e){}</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bg">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div id="splash"><h1>Hello ya handsa 🍀<span class="wave">👋🏾</span></h1></div>
  <main class="wrap">
    <div class="stack {% block stackclass %}{% endblock %}">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </main>
  <script>try{sessionStorage.setItem('greeted','1')}catch(e){}</script>
  <script src="{{ url_for('static', filename='validate.js') }}"></script>
</body>
</html>
